<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps</title>
<link rel="icon" href="stage10/favicon.png">
<style>
:root{--bg:#F2F5FF;--panel:#fff;--ink:#1B2150;--soft:#6B7399;--line:#E1E6F6;--a:#4F5BFF}
@media (prefers-color-scheme:dark){:root{--bg:#0D1130;--panel:#171D4A;--ink:#EEF1FF;--soft:#9EA7DA;--line:#2A3372;--a:#6A74FF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:40px 16px 56px}
h1{font-size:32px;margin:0 0 24px}
.app{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:16px;margin-bottom:12px;color:var(--ink);text-decoration:none}
.app:hover{border-color:var(--a)}
.app img{width:64px;height:64px;border-radius:15px;flex:none}
.app strong{display:block;font-size:19px}
.app span{color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
<h1>Apps</h1>
<a class="app" href="stage10/">
  <img src="stage10/icon.png" alt="" width="64" height="64">
  <div><strong>Stage10</strong><span>Reflexes under pressure</span></div>
</a>
</div>
</body>
</html>
